<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="/enviar">
  <label for="nome">Nome: </label>
  <input type="text" id="nome" name="nome" required><br>

  <label for="email">Email: </label>
  <input type="email" id="email" name="email" required><br>

  <label for="senha">Senha: </label>
  <input type="password" id="senha" name="senha" required><br>

  <label for="senha">Confirme a senha: </label>
  <input type="password" id="senha" name="senha" required><br>

  <input type="radio" id="masculino" name="sexo" value="masculino" checked>
  <label for="masculino">Masculino</label><br>

  <input type="radio" id="feminino" name="sexo" value="feminino" checked>
  <label for="feminino">Feminino</label><br>
  <p>Quais são os seus interesses</p>
  <input type="checkbox" id="tec" name="interesses" value="tecnologia" checked>
  <label for="tec">Tecnologia</label><br>

  <input type="checkbox" id="esporte" name="interesses" value="esportes">
  <label for="esporte">Esportes</label><br>

  <input type="checkbox" id="musica" name="interesses" value="musica">
  <label for="musica">Música</label><br>

  <label for="estado">Estado:</label>
  <select id="estado" name="estado">
    <option value="">Selecione um estado</option>
    <optgroup label="Nordeste">
      <option value="pe" selected>Pernambuco</option>
      <option value="pb">Paraíba</option>
    </optgroup>
    <optgroup label="Sudeste">
      <option value="sp">São Paulo</option>
      <option value="rj">Rio de Janeiro</option>
    </optgroup>
  </select><br><br>

  <button type="submit">enviar</button>
  </form>
</body>
</html>
